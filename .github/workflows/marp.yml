name: marp
concurrency: marp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Pages is deployed straight from this workflow (no gh-pages branch): the
# built site is uploaded as an artifact and published by actions/deploy-pages.
# Nothing lands in git, so the copies students make from this template
# inherit only the source, and the deployment history lives in the
# github-pages environment with rollback, instead of as commits nobody reads.
# Least privilege by default: the build job only reads the repo. The Pages
# write + OIDC token are granted to the deploy job alone, so the job that
# runs marp, npm and the build scripts cannot publish to the site even if
# something it executes tries to.
permissions:
  contents: read

jobs:
  build:
    # Only ever run in the module's own repo. Students copy this repo from
    # the template, and a template copy has Actions ENABLED (unlike a fork),
    # so without this guard their first push would run this workflow, fail
    # at the Pages deploy they have not configured, and mail them a red X.
    if: github.repository == 'danielcregg/ai-assisted-programming'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12, to match .devcontainer/devcontainer.json. The lab gate's
          # promise is "this material runs for a student", so it has to run on
          # the interpreter the student's Codespace actually has. Change both
          # together or the promise stops being true.
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gate dependencies
        run: |
          set -euo pipefail
          # pyyaml: verify_snippets parses ```yaml fences. Without it every
          # yaml fence is reported as a failure rather than skipped, which is
          # deliberate -- a missing parser must not look like a clean run.
          # markdown: build_lab_pages renders lab READMEs.
          # pytest: verify_labs runs the labs' own tests.
          python -m pip install --quiet pyyaml markdown pytest

      - name: Install lab dependencies
        run: |
          set -euo pipefail
          # Best-effort, and deliberately non-fatal: verify_labs reports a lab
          # whose dependencies are absent as "tests not run", which is honest,
          # rather than failing the build for a lab that needs a live API key
          # nobody has in CI. A lab whose requirements install cleanly gets its
          # tests actually run.
          for req in labs/*/requirements.txt labs/*/*/requirements.txt; do
            [ -f "$req" ] || continue
            echo "::group::$req"
            python -m pip install --quiet -r "$req" || echo "skipped: $req"
            echo "::endgroup::"
          done

      - name: Gates - safety, links, snippets, labs, structure, portability, notes
        run: |
          set -euo pipefail
          python scripts/safety_audit.py
          python scripts/check_links.py
          python scripts/verify_snippets.py
          python scripts/verify_labs.py
          python scripts/check_practice_bank.py
          python scripts/check_lab_structure.py
          python scripts/check_deck_portability.py
          python scripts/check_speaker_notes.py

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@4.5.0

      - name: Render decks and build the site
        run: |
          set -euo pipefail
          mkdir -p build
          # build_index.py is the sixth gate: it fails if a teaching week has
          # no deck and no PENDING_DECKS entry, or no matching lab.
          python scripts/build_index.py build
          # also renders project/*.md to build/project/*.html
          python scripts/build_lab_pages.py build
          mkdir -p build/practice
          cp -R practice/. build/practice/
          # mapfile, NOT find|while: a piped while-loop hands the pipe to the
          # loop body's stdin, and marp-cli treats piped stdin as an extra
          # markdown input ("Converting 2 markdowns" + output-path error).
          mapfile -t decks < <(find weeks -type f -name 'slides.md' | sort)
          for f in "${decks[@]}"; do
            week_dir_path=$(dirname "$f")
            week_dir=$(basename "$week_dir_path")
            out="build/$week_dir"
            mkdir -p "$out"
            if [ -d "$week_dir_path/img" ]; then cp -R "$week_dir_path/img" "$out/img"; fi
            marp "$f" --html --allow-local-files --theme-set themes/aiap.css -o "$out/index.html"
            # PDF only. Marp's pptx export wraps each slide as an image, so it
            # offers nothing the PDF doesn't, while adding ~6 MB per deck to
            # every deploy.
            marp "$f" --html --allow-local-files --theme-set themes/aiap.css -o "$out/slides.pdf"
          done
          touch build/.nojekyll   # serve the output as-is; no Jekyll pass

      - name: Upload rendered decks as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-decks
          path: build/

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/

  deploy:
    needs: build
    if: github.repository == 'danielcregg/ai-assisted-programming'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # publish the artifact
      id-token: write     # OIDC token deploy-pages exchanges for that right
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
